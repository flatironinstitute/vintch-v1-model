name: check_nemos_version
on:
  workflow_dispatch:
  schedule:
  - cron: 0 0 * * 0     # weekly
  pull_request:
    branches:
    - main

permissions: {}

jobs:
  check_pytorch_version:
    runs-on: ubuntu-latest
    name: Check for nemos release
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false
    - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 #v6.2.0
    - run: |
        recent_version=$(pip index versions nemos | grep -oE "nemos \([0-9\.]*?" | sed 's/nemos (//g')
        if [[ $recent_version != "0.2.9" ]]; then
            echo "nemos release, change install target in toml";
            exit 1;
        fi
